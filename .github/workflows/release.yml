name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

# Least privilege. contents:write creates the release; the other two are what
# actions/attest-build-provenance needs to sign the assets, and the community
# directory's review checks for that attestation.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18.x"

      - name: Build
        run: |
          npm ci
          npm run build

      # This plugin claims to make zero outbound requests; this CI step
      # defends that claim by aborting the release if the bundle contains
      # any network call site. These are the entry points an Obsidian plugin
      # could use to reach the network: fetch / XMLHttpRequest / WebSocket are
      # native browser APIs, requestUrl is Obsidian's CORS-bypassing
      # alternative, sendBeacon is the usual telemetry channel, and EventSource
      # is server-sent events. A hit on any of them breaks the privacy claim.
      #
      # The grep sits inside an `if` condition on purpose: this step runs under
      # `bash -e`, where a bare grep that matches nothing exits 1 and would kill
      # the step. An `if` condition is explicitly exempt from that behaviour.
      - name: Verify no network APIs in bundle
        run: |
          if MATCHES="$(grep -nE 'fetch\(|XMLHttpRequest|WebSocket|requestUrl|sendBeacon|EventSource' main.js)"; then
            echo "::error::Network API call sites found in main.js; this breaks the zero-outbound-request privacy claim."
            echo "$MATCHES"
            exit 1
          fi
          echo "0 hits: main.js contains no network API call sites."

      # Signed provenance for the three files the release ships. It records
      # which workflow, commit and runner produced them, so anyone can verify
      # the assets came from this repository rather than being uploaded by
      # hand.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Create the release and upload the assets with the gh CLI that ships
      # preinstalled on the runner image, replacing the archived
      # actions/create-release@v1 and actions/upload-release-asset@v1. gh is a
      # first-party GitHub tool, is already present in runner-images, and is
      # authorised by GITHUB_TOKEN with no extra grant. It pulls in no
      # third-party action at all, which made it the lowest supply-chain risk of
      # the three options considered.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "./main.js" \
            "./manifest.json" \
            "./styles.css" \
            --title "${{ github.ref_name }}" \
            --generate-notes
